# Words the user may type for each body region (in /dor and future free text).
# Keys are the stored body_region codes; values are comma-separated aliases,
# matched without accents or case. An alias must belong to a single region.
head=cabeça, cabeca, testa
neck=pescoço, nuca, garganta
chest=peito, tórax
abdomen=abdômen, abdome, barriga, estômago
upper_back=costas, costas em cima, parte de cima das costas, dorsal
lower_back=lombar, costas embaixo, costas baixa, região lombar, parte de baixo das costas
left_arm=braço esquerdo, ombro esquerdo, cotovelo esquerdo, mão esquerda, punho esquerdo
right_arm=braço direito, ombro direito, cotovelo direito, mão direita, punho direito
left_knee=joelho esquerdo
right_knee=joelho direito
left_leg=perna esquerda, coxa esquerda, panturrilha esquerda, tornozelo esquerdo, pé esquerdo
right_leg=perna direita, coxa direita, panturrilha direita, tornozelo direito, pé direito
systemic=corpo todo, corpo inteiro, geral, sistêmica, sistêmico
