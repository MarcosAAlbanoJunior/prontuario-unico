# Development database only. The app runs on the JVM with ./mvnw -f backend spring-boot:run.
# Usage: docker compose -f deploy/compose.dev.yml up -d
name: prontuario-unico-dev

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: prontuario
      POSTGRES_USER: prontuario
      POSTGRES_PASSWORD: prontuario
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql

volumes:
  pgdata-dev:
